<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración — Accidentes Lanzarote</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <header class="admin-header">
        <div class="admin-header-inner">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <h1>Panel de Administración</h1>
            </div>
            <nav class="admin-nav">
                <a href="index.html" class="admin-nav-link">Ver Web</a>
            </nav>
        </div>
    </header>

    <main class="admin-main">
        <!-- Pestañas de navegación -->
        <div class="admin-nav-tabs">
            <a href="admin.html" class="admin-nav-tab active">Noticias</a>
            <a href="usuarios.html" class="admin-nav-tab">Usuarios registrados</a>
        </div>

        <!-- Sección de Noticias -->
        <div class="admin-tab-content active" id="tab-noticias">
            <!-- Estadísticas -->
            <section class="admin-stats">
                <div class="admin-stat-card">
                    <div class="admin-stat-number" id="stat-total">0</div>
                    <div class="admin-stat-label">Total</div>
                </div>
                <div class="admin-stat-card pendiente">
                    <div class="admin-stat-number" id="stat-pendientes">0</div>
                    <div class="admin-stat-label">Pendientes</div>
                </div>
                <div class="admin-stat-card aprobada">
                    <div class="admin-stat-number" id="stat-aprobadas">0</div>
                    <div class="admin-stat-label">Aprobadas</div>
                </div>
            </section>

            <!-- Filtros -->
            <section class="admin-filters">
                <div class="admin-filters-inner">
                    <input type="text" id="admin-buscador" placeholder="Buscar noticias..." class="admin-input">
                    <select id="admin-filtro-estado" class="admin-select">
                        <option value="">Todos los estados</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="aprobada">Aprobada</option>
                    </select>
                    <select id="admin-filtro-zona" class="admin-select">
                        <option value="">Todas las zonas</option>
                        <option value="Arrecife">Arrecife</option>
                        <option value="Teguise">Teguise</option>
                        <option value="San Bartolomé">San Bartolomé</option>
                        <option value="Tías">Tías</option>
                        <option value="Yaiza">Yaiza</option>
                        <option value="Tinajo">Tinajo</option>
                        <option value="Haría">Haría</option>
                    </select>
                    <select id="admin-filtro-tipo" class="admin-select">
                        <option value="">Todos los tipos</option>
                        <option value="Colisión">Colisión</option>
                        <option value="Atropello">Atropello</option>
                        <option value="Salida de vía">Salida de vía</option>
                        <option value="Vuelco">Vuelco</option>
                        <option value="Moto">Moto</option>
                    </select>
                </div>
            </section>

            <!-- Lista de noticias -->
            <section class="admin-news-list" id="admin-news-list">
                <!-- Las noticias se cargan dinámicamente -->
            </section>
        </div>

        <!-- Sección de Usuarios -->
        <div class="admin-tab-content" id="tab-usuarios">
            <section class="admin-users-list" id="admin-users-list">
                <!-- Los usuarios se cargan dinámicamente -->
            </section>
        </div>
    </main>

    <!-- Modal para editar -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Noticia</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="edit-form" class="modal-body">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="edit-titulo">Título</label>
                    <input type="text" id="edit-titulo" required>
                </div>
                <div class="form-group">
                    <label for="edit-descripcion">Descripción</label>
                    <textarea id="edit-descripcion" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-resumen">Resumen IA</label>
                    <textarea id="edit-resumen" rows="2"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-zona">Zona</label>
                        <input type="text" id="edit-zona" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-municipio">Municipio</label>
                        <input type="text" id="edit-municipio" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-tipo">Tipo</label>
                        <select id="edit-tipo" required>
                            <option value="Colisión">Colisión</option>
                            <option value="Atropello">Atropello</option>
                            <option value="Salida de vía">Salida de vía</option>
                            <option value="Vuelco">Vuelco</option>
                            <option value="Moto">Moto</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edit-fecha">Fecha</label>
                        <input type="date" id="edit-fecha" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-lat">Latitud</label>
                        <input type="number" id="edit-lat" step="any">
                    </div>
                    <div class="form-group">
                        <label for="edit-lng">Longitud</label>
                        <input type="number" id="edit-lng" step="any">
                    </div>
                </div>
                <div class="form-group">
                    <label for="edit-fuente">Fuente</label>
                    <input type="text" id="edit-fuente" required>
                </div>
                <div class="form-group">
                    <label for="edit-url">URL Fuente</label>
                    <input type="url" id="edit-url">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para ver detalles -->
    <div class="modal" id="view-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Detalles de la Noticia</h2>
                <button class="modal-close" id="view-modal-close">&times;</button>
            </div>
            <div class="modal-body" id="view-modal-body">
                <!-- Contenido dinámico -->
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="admin.js"></script>
</body>
</html>
