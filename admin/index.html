<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Accidentes Lanzarote</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="admin-header">
        <div class="admin-header-inner">
            <div class="admin-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <h1>Admin <span>Accidentes Lanzarote</span></h1>
            </div>
            <div class="admin-actions">
                <button id="btn-ver-ollama" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                    Estado Ollama
                </button>
                <button id="btn-generar" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                    Generar Noticias
                </button>
                <a href="../index.html" class="btn btn-ghost" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                        <polyline points="15 3 21 3 21 9"/>
                        <line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                    Ver Web
                </a>
            </div>
        </div>
    </header>

    <main class="admin-main">
        <!-- Estadísticas -->
        <section class="admin-stats">
            <div class="stat-card">
                <div class="stat-number" id="stat-total">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card pendiente">
                <div class="stat-number" id="stat-pendientes">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
            <div class="stat-card aprobada">
                <div class="stat-number" id="stat-aprobadas">0</div>
                <div class="stat-label">Aprobadas</div>
            </div>
            <div class="stat-card rechazada">
                <div class="stat-number" id="stat-rechazadas">0</div>
                <div class="stat-label">Rechazadas</div>
            </div>
        </section>

        <!-- Pestañas -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="pendientes">
                Pendientes de revisión
                <span class="badge" id="badge-pendientes">0</span>
            </button>
            <button class="tab-btn" data-tab="aprobadas">Aprobadas</button>
            <button class="tab-btn" data-tab="rechazadas">Rechazadas</button>
            <button class="tab-btn" data-tab="todas">Todas</button>
            <button class="tab-btn" data-tab="logs">Logs</button>
        </div>

        <!-- Contenido de pestañas -->
        <div class="tab-content">
            <!-- Pendientes -->
            <div id="tab-pendientes" class="tab-pane active">
                <div class="news-list" id="lista-pendientes">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 6v6l4 2"/>
                        </svg>
                        <p>No hay noticias pendientes de revisión</p>
                    </div>
                </div>
            </div>

            <!-- Aprobadas -->
            <div id="tab-aprobadas" class="tab-pane">
                <div class="news-list" id="lista-aprobadas">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        <p>No hay noticias aprobadas</p>
                    </div>
                </div>
            </div>

            <!-- Rechazadas -->
            <div id="tab-rechazadas" class="tab-pane">
                <div class="news-list" id="lista-rechazadas">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="15" y1="9" x2="9" y2="15"/>
                            <line x1="9" y1="9" x2="15" y2="15"/>
                        </svg>
                        <p>No hay noticias rechazadas</p>
                    </div>
                </div>
            </div>

            <!-- Todas -->
            <div id="tab-todas" class="tab-pane">
                <div class="news-list" id="lista-todas">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="9" y1="21" x2="9" y2="9"/>
                        </svg>
                        <p>No hay noticias registradas</p>
                    </div>
                </div>
            </div>

            <!-- Logs -->
            <div id="tab-logs" class="tab-pane">
                <div class="logs-list" id="lista-logs">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                        <p>No hay registros de actividad</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de detalles -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-titulo">Detalles de la noticia</h3>
                <button class="modal-close" id="modal-cerrar">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Contenido dinámico -->
            </div>
            <div class="modal-footer" id="modal-footer">
                <!-- Botones dinámicos -->
            </div>
        </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script src="admin.js"></script>
</body>
</html>
