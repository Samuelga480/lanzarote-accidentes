<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticia — Accidentes Lanzarote</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="noticia.css">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <h1>Accidentes Lanzarote</h1>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Inicio</a>
                <a href="login.html" class="nav-link nav-admin" id="nav-login">Acceder</a>
            </nav>
        </div>
    </header>

    <main class="noticia-main">
        <article class="noticia-article" id="noticia-content">
            <!-- Contenido dinámico -->
        </article>

        <section class="noticia-mapa">
            <h2>Ubicación del accidente</h2>
            <div class="map-container">
                <div id="map"></div>
            </div>
        </section>

        <!-- Comentarios -->
        <section class="comentarios-section">
            <h2>Comentarios</h2>
            <div id="comentarios-form-container">
                <!-- Formulario de comentarios -->
            </div>
            <div id="comentarios-list">
                <!-- Lista de comentarios -->
            </div>
        </section>

        <section class="noticia-relacionadas">
            <h2>Noticias relacionadas</h2>
            <div class="news-grid" id="related-news">
                <!-- Noticias relacionadas -->
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Accidentes Lanzarote. Información publicada con fines informativos. En caso de emergencia, llama al 112.</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="noticia.js"></script>
</body>
</html>
