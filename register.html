<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — Accidentes Lanzarote</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                    <h1>Accidentes <span>Lanzarote</span></h1>
                </div>
                <p>Crear cuenta de invitado</p>
            </div>
            <form id="register-form" class="login-form">
                <div class="form-group">
                    <label for="reg-email">Correo electrónico</label>
                    <input type="email" id="reg-email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" data-target="reg-password" aria-label="Mostrar contraseña">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-password2">Confirmar contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password2" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" data-target="reg-password2" aria-label="Mostrar contraseña">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="register-error" class="login-error"></div>
                <button type="submit" class="btn btn-primary btn-full">Crear cuenta</button>
            </form>
            <div class="login-footer">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
                <a href="index.html">← Volver a la web</a>
            </div>
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
