<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios Registrados — Accidentes Lanzarote</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <header class="admin-header">
        <div class="admin-header-inner">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <h1>Usuarios Registrados</h1>
            </div>
            <nav class="admin-nav">
                <a href="index.html" class="admin-nav-link">Ver Web</a>
                <button class="btn btn-secondary" onclick="cerrarSesion()">Cerrar Sesión</button>
            </nav>
        </div>
    </header>

    <main class="admin-main">
        <!-- Pestañas de navegación -->
        <div class="admin-nav-tabs">
            <a href="admin.html" class="admin-nav-tab">Noticias</a>
            <a href="usuarios.html" class="admin-nav-tab active">Usuarios registrados</a>
        </div>

        <!-- Buscador -->
        <section class="admin-filters">
            <div class="admin-filters-inner">
                <input type="text" id="usuarios-buscador" placeholder="Buscar por nombre o correo..." class="admin-input">
                <select id="usuarios-filtro-rol" class="admin-select">
                    <option value="">Todos los roles</option>
                    <option value="admin">Administrador</option>
                    <option value="invitado">Invitado</option>
                </select>
            </div>
        </section>

        <!-- Estadísticas -->
        <section class="admin-stats">
            <div class="admin-stat-card">
                <div class="admin-stat-number" id="stat-total-usuarios">0</div>
                <div class="admin-stat-label">Total usuarios</div>
            </div>
            <div class="admin-stat-card aprobada">
                <div class="admin-stat-number" id="stat-admins">0</div>
                <div class="admin-stat-label">Administradores</div>
            </div>
            <div class="admin-stat-card pendiente">
                <div class="admin-stat-number" id="stat-invitados">0</div>
                <div class="admin-stat-label">Invitados</div>
            </div>
        </section>

        <!-- Lista de usuarios -->
        <section class="admin-users-list" id="admin-users-list">
            <!-- Los usuarios se cargan dinámicamente -->
        </section>
    </main>

    <!-- Modal para ver comentarios de usuario -->
    <div class="modal" id="comentarios-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Comentarios de <span id="comentarios-usuario-nombre"></span></h2>
                <button class="modal-close" id="comentarios-modal-close">&times;</button>
            </div>
            <div class="modal-body" id="comentarios-modal-body">
                <!-- Contenido dinámico -->
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="usuarios.js"></script>
</body>
</html>
